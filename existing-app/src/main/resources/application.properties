quarkus.rest-client.catalog-api.url=http://localhost:8081
%prod.quarkus.rest-client.catalog-api.url=http://catalog-service:8080

quarkus.rest-client.user-api.url=http://localhost:8082
%prod.quarkus.rest-client.user-api.url=http://user-service:8080

quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:grocery-shop}
app.seed-products=${APP_SEED_PRODUCTS:true}

%test.quarkus.mongodb.database=grocery-shop-test
%test.app.seed-products=false

mp.jwt.verify.publickey.location=${JWT_VERIFY_KEY_LOCATION:keys/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:grocery-eshop}

%test.smallrye.jwt.sign.key.location=keys/privateKey.pem
%test.smallrye.jwt.new-token.issuer=grocery-eshop
%test.smallrye.jwt.new-token.lifespan=3600

