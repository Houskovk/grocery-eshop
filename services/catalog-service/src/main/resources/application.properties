quarkus.http.port=${HTTP_PORT:8081}

quarkus.http.test-port=8091


quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017}
%prod.quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://mongodb:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:eshop-catalog}
app.seed-products=${APP_SEED_PRODUCTS:true}

%test.quarkus.mongodb.database=eshop-catalog-test
%test.app.seed-products=false

# The frontend is served from its own origin (see /frontend) and calls catalog-service directly,
# so cross-origin requests need to be allowed.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS

