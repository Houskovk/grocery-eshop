services:
  mongodb:
    image: mongo:8
    container_name: grocery-mongodb
    ports:
      - "27017:27017"
    volumes:
      - grocery-mongodb-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/src/main/docker/Dockerfile.jvm
    container_name: grocery-catalog-service
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      HTTP_PORT: 8080
      MONGODB_CONNECTION_STRING: mongodb://mongodb:27017
      MONGODB_DATABASE: eshop-catalog
    ports:
      - "8081:8080"

  app:
    build:
      context: .
      dockerfile: existing-app/src/main/docker/Dockerfile.jvm
    container_name: grocery-eshop
    depends_on:
      mongodb:
        condition: service_healthy
      catalog-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      QUARKUS_REST_CLIENT_CATALOG_API_URL: http://catalog-service:8080
      MONGODB_CONNECTION_STRING: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_TOKEN_LIFESPAN: ${JWT_TOKEN_LIFESPAN}
      JWT_SIGN_KEY_LOCATION: /work/keys/privateKey.pem
      JWT_VERIFY_KEY_LOCATION: /work/keys/publicKey.pem
    volumes:
      - ./existing-app/src/main/resources/keys:/work/keys:ro

volumes:
  grocery-mongodb-data: