<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Your Cart - Grocery Shop</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<header>
    <div class="container header-row">
        <div>
            <h1><a href="/index.html" class="site-title">Grocery Shop</a></h1>
            <p>Simple groceries. Simple shopping.</p>
        </div>
        <div id="auth-area" class="auth-area"></div>
        <a href="/cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
    </div>
</header>

<main class="container">

    <section>
        <h2>Your Cart</h2>

        <div id="cart-items"></div>

        <h2>
            Total:
            <span id="cart-total">0.00</span>
        </h2>

        <button type="button" id="checkout-button">
            Checkout
        </button>

        <button type="button" onclick="clearCart()">
            Clear cart
        </button>
    </section>

    <section>
        <h2>Order History</h2>
        <div id="orders">Loading orders...</div>
    </section>

</main>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>

</body>
</html>
