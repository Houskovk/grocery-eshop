<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>My Wallet - Grocery Shop</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<header>
    <div class="container header-row">
        <div>
            <h1><a href="/index.html" class="site-title">Grocery Shop</a></h1>
            <p>Simple groceries. Simple shopping.</p>
        </div>
        <div id="auth-area" class="auth-area"></div>
        <a href="/cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
    </div>
</header>

<main class="container">

    <section class="auth-form">
        <h2>My Wallet</h2>

        <p>Current balance</p>
        <p id="balance-amount" class="balance-amount">Loading...</p>

        <label for="addAmount">Add funds (EUR)</label>
        <input id="addAmount" type="number" min="0.01" step="0.01" placeholder="0.00">

        <button type="button" onclick="addFunds()">Add Funds</button>

        <p id="balanceMessage"></p>
    </section>

</main>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/balance.js"></script>

</body>
</html>
