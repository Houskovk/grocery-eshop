<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Grocery Shop</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<header>
    <div class="container header-row">
        <div>
            <h1><a href="/index.html" class="site-title">Grocery Shop</a></h1>
            <p>Simple groceries. Simple shopping.</p>
        </div>
        <div id="auth-area" class="auth-area"></div>
        <a href="/cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
    </div>
</header>

<main class="container">

    <section class="auth-form">
        <h2>Register</h2>

        <input id="registerUsername" placeholder="Username">
        <input id="registerPassword" type="password" placeholder="Password">

        <button type="button" onclick="register()">Register</button>

        <p id="registerMessage"></p>
    </section>

</main>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/register.js"></script>

</body>
</html>
