%dev.quarkus.mongodb.connection-string=mongodb://localhost:27017
%dev.quarkus.mongodb.database=grocery-shop
%dev.app.seed-products=true

%test.quarkus.mongodb.database=grocery-shop-test
%test.app.seed-products=false

mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=grocery-eshop

smallrye.jwt.sign.key.location=keys/privateKey.pem
smallrye.jwt.new-token.issuer=grocery-eshop
smallrye.jwt.new-token.lifespan=3600